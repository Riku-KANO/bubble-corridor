<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>音の確認ページ（泡沫回廊・音楽と音）</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; padding: 20px 24px 60px; background: #14181f; color: #e6ecf5; font: 15px/1.6 system-ui, 'Noto Sans JP', sans-serif; }
      h1 { font-size: 20px; font-weight: 500; margin: 0 0 4px; }
      h2 { font-size: 14px; font-weight: 600; margin: 26px 0 8px; color: #9fb4d6; letter-spacing: 0.04em; }
      p.note { margin: 2px 0 10px; color: #8693a8; font-size: 13px; }
      button, select { font: inherit; color: inherit; background: #26303f; border: 1px solid #3a4658; border-radius: 6px; padding: 5px 12px; cursor: pointer; }
      button:hover { background: #2f3b4e; }
      button.primary { background: #3b5f9a; border-color: #5b86c8; }
      button:disabled { opacity: 0.4; cursor: default; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
      .grid.wide { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
      #status, #now { font-variant-numeric: tabular-nums; white-space: pre; background: #0d1117; padding: 10px 12px; border-radius: 8px; color: #b9c8e0; }
      input[type='range'] { width: min(640px, 100%); }
      label.vol { display: inline-flex; gap: 6px; align-items: center; margin-right: 14px; }
      table { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
      td, th { padding: 2px 10px; text-align: right; border-bottom: 1px solid #263041; }
      th:first-child, td:first-child { text-align: left; }
      #measureOut { margin-top: 8px; max-height: 360px; overflow: auto; }
    </style>
  </head>
  <body>
    <h1>音の確認ページ</h1>
    <p class="note">本番ビルドには含まれません。ブラウザの規則で、最初に「音を有効にする」を押さないと音は出ません。</p>
    <div class="row"><button id="enable" class="primary">音を有効にする</button><span id="enabled"></span></div>
    <div id="status">未開始</div>

    <h2>再生</h2>
    <div class="row" id="sections"></div>
    <div class="row">
      <button id="play">再生 / 続き</button>
      <button id="pause">ポーズ</button>
      <label>扉
        <select id="door"><option value="lapis">瑠璃（青）</option><option value="amber">琥珀（金）</option></select>
      </label>
    </div>
    <div class="row"><input id="seek" type="range" min="0" max="780" step="1" value="0" /><span id="seekLabel">0:00</span></div>
    <div id="now">-</div>

    <h2>触れた音（その瞬間の和音と調に揃って、次の8分音符に鳴る）</h2>
    <div class="grid" id="pads"></div>
    <p class="note">同じ物を0.3秒以内に押すと間引かれます（戻り値 null）。9回以上すばやく押すと同時発音の上限で間引かれます。</p>
    <div id="touchLog" class="note"></div>

    <h2>出来事の効果音（膜・見どころ）</h2>
    <div class="grid wide" id="cues"></div>
    <div class="row"><button id="lure">誘導音（左前の方向から）</button></div>

    <h2>UI・遷移の音</h2>
    <div class="grid" id="sfx"></div>

    <h2>入口の音楽・音量</h2>
    <div class="row"><button id="lobbyOn">入口の音楽を流す</button><button id="lobbyOff">止める</button></div>
    <div class="row" id="vols"></div>

    <h2>測る（OfflineAudioContext で曲を描き、音の大きさと割れを数える）</h2>
    <div class="row">
      <button id="measureTimbres">音色ごとの大きさ</button>
      <button id="measureRide">乗車全体の大きさの流れ</button>
      <span id="measureState"></span>
    </div>
    <div id="measureOut"></div>

    <script type="module" src="/src/dev/audio/main.ts"></script>
  </body>
</html>
